# This workflow will build and test the Shopizy .NET 10 solution
name: .NET CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Shopizy.sln

    - name: Build Solution
      run: dotnet build Shopizy.sln --no-restore --configuration Release --warnaserror

    - name: Run Automated Tests
      run: dotnet test Shopizy.sln --no-build --configuration Release --verbosity normal
